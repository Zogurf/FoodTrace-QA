# Perfil explícito de carga. Usar después de aplicar la migración SQL pendiente.
# No crear ni actualizar el esquema automáticamente durante la carga.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# No ocupa el puerto normal de la API durante la carga.
server.port=0

app.seed.prefix=demo20k
app.seed.password=${SEED_PASSWORD:}
app.seed.random-seed=20261116
app.seed.usuarios=100
app.seed.proveedores=200
app.seed.materias=200
app.seed.productos=100
app.seed.entradas=6000
app.seed.producciones=4000
app.seed.consumos=8000
app.seed.controles=6400
