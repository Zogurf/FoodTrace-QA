version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodtrace-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01-foodtrace.sql:/docker-entrypoint-initdb.d/01-foodtrace.sql:ro

volumes:
  mysql_data: